[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "be"
version = "2.2.0"
description = "Breaking Edge: A library for automated trading systems."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5",
    "hyperliquid-python-sdk>=0.24.0",
    "eth-account>=0.13.7",
    "joblib>=1.6.0",
    "matplotlib>=3.11.1",
    "numba>=0.67.0",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "python-binance>=1.0.37",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "ta>=0.11.0",
    "tenacity>=9.1.4",
    "tqdm>=4.70.1",
    "yfinance>=1.7.0",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"be" = ["py.typed"]
